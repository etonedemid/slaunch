;title='sLaunch Control'
;version=1.0.1
;creator='sLaunch'
;about='Restart the sLaunch menu without rebooting the console.'

; A plain press runs it. The request is written with set-ini-val because every
; UltraHand version has it (touch is newer); the daemon only checks that the
; file exists, then deletes it.
[Restart sLaunch]
set-ini-val /slaunch/config/restart_menu.request restart now 1
notify-now 'sLaunch restart requested'
